<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithma - Модул 2</title>
    <style>
        /* Базови стилове */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Главно Меню (Navbar) */
        .navbar {
            background: linear-gradient(90deg, #1e272e, #2d3436);
            color: #fff;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 3px;
            color: #00cec9;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            font-size: 1.8rem;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: #b2bec3;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            padding: 8px 15px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .nav-links a.active {
            color: #fff;
            background-color: #0984e3;
            box-shadow: 0 2px 5px rgba(9, 132, 227, 0.4);
        }

        /* Основен Контейнер */
        .main-content {
            flex: 1;
            padding: 40px 20px;
        }

        .module-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Изчакващо съобщение */
        .coming-soon-box {
            background: #fff;
            border-radius: 8px;
            padding: 50px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            border-left: 5px solid #0984e3;
            color: #7f8c8d;
            font-size: 1.3rem;
            font-style: italic;
        }

        /* Футър */
        .footer {
            background-color: #1e272e;
            color: #7f8c8d;
            text-align: center;
            padding: 20px;
            margin-top: auto;
            font-size: 0.95rem;
            border-top: 3px solid #0984e3;
        }
    </style>
</head>

<body>

    <!-- Главно Меню -->
    <nav class="navbar">
        <div class="brand">
            <span class="brand-icon">⚡</span> ALGORITHMA
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Модул 1</a></li>
            <li><a href="module2.html" class="active">Модул 2</a></li>
            <li><a href="module3.html">Модул 3</a></li>
            <li><a href="module4.html">Модул 4</a></li>
        </ul>
    </nav>

    <!-- Основно Съдържание -->
    <div class="main-content">
        <div class="module-container">
            <h1>Модул 2: СДА</h1>

            <div class="coming-soon-box">
                Очакваме уроци и практически задачи.
            </div>

        </div>
    </div>

    <!-- Футър -->
    <footer class="footer">
        <div>&copy; 2026 Algorithma. Всички права запазени.</div>
    </footer>

</body>

</html>
